server {
    listen 80;
    server_name ferme.exemple.ga;
    client_max_body_size 5M;            # photos des demandes de conseil

    location /static/ { alias /srv/fermegest/staticfiles/; }
    location /media/  { alias /srv/fermegest/media/; }

    location / {
        proxy_pass http://unix:/run/fermegest.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
