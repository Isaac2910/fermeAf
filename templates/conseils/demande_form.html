{% extends "base.html" %}{% block titre %}Nouvelle demande{% endblock %}
{% block contenu %}
<h1 class="page-titre h3 mb-3"><i class="bi bi-question-circle"></i> Demander un conseil à un expert</h1>
<div class="card" style="max-width:820px"><div class="card-body p-4">
  <form method="post" enctype="multipart/form-data" novalidate>{% csrf_token %}
    {{ form.non_field_errors }}
    <div class="row g-3">
      {% for champ in form %}
      <div class="{% if champ.name == 'description' or champ.name == 'titre' %}col-12{% else %}col-md-6{% endif %}">
        <label class="form-label">{{ champ.label }}{% if champ.field.required %} <span class="text-danger">*</span>{% endif %}</label>{{ champ }}
        {% for e in champ.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
      </div>{% endfor %}
    </div>
    <div class="mt-4 d-flex gap-2"><button class="btn btn-primary"><i class="bi bi-send"></i> Envoyer la demande</button>
    <a class="btn btn-outline-secondary" href="{% url 'conseils:mes_demandes' %}">Annuler</a></div>
  </form>
</div></div>
{% endblock %}
